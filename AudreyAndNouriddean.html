    <!-- PHOTO GRID
         Copy/paste a <figure> block to add a photo, delete one to remove it.
         Photos keep their natural proportions. Clicking opens the lightbox. -->

      <figure class="grid-cell" onclick="openLightbox(this)">
        <img src="images/AudreyAndNouriddean-01.jpg" alt="Describe photo 1" />
      </figure>
      <figure class="grid-cell" onclick="openLightbox(this)">
        <img src="images/AudreyAndNouriddean-02.jpg" alt="Describe photo 2" />
      </figure>
      <figure class="grid-cell" onclick="openLightbox(this)">
        <img src="images/AudreyAndNouriddean-03.jpg" alt="Describe photo 2" />
      </figure>
        <figure class="grid-cell" onclick="openLightbox(this)">
        <img src="images/AudreyAndNouriddean-04.jpg" alt="Describe photo 2" />
      </figure>

 <div class="project-text">

</div> 

  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-prev" onclick="event.stopPropagation(); shiftImage(-1)">&#8592;</button>
    <button class="lightbox-next" onclick="event.stopPropagation(); shiftImage(1)">&#8594;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" onclick="event.stopPropagation()" />
  </div>

  <script>
    const cells = Array.from(document.querySelectorAll('.grid-cell'));
    let current = 0;

    function openLightbox(el) {
      current = cells.indexOf(el);
      const src = el.querySelector('img').src;
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function shiftImage(dir) {
      current = (current + dir + cells.length) % cells.length;
      document.getElementById('lightbox-img').src = cells[current].querySelector('img').src;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') shiftImage(1);
      if (e.key === 'ArrowLeft') shiftImage(-1);
    });
  </script>
<script src="/assets/js/external-links.js"></script>
