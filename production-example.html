<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Title — Anna Horzen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="wordmark">Anna Horzen</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">Design</a>
      <a href="productions.html" class="nav-link nav-link--active">Productions</a>
      <a href="photography.html" class="nav-link">Photography</a>
      <a href="about.html" class="nav-link">About</a>
    </nav>
  </header>

  <main class="production-main">

    <section class="production-intro">
      <a href="productions.html" class="back-link">&larr; All productions</a>
      <h1 class="production-title">Production Title</h1>
      <div class="production-meta">
          <span>Projection Design</span>
          <span>Venue</span>
          <span>Year</span>
      </div>
      <p class="production-desc">
        A short description of the production and your role in it.
      </p>
    </section>

    <div class="masonry-grid">
      <!-- Gallery images. Optional captions: fill in data-title / data-subtitle. -->
      <figure class="grid-cell" onclick="openLightbox(this)"
              data-title=""
              data-subtitle="">
        <img src="images/productions/example/01.jpg" alt="" />
      </figure>
      <figure class="grid-cell" onclick="openLightbox(this)"
              data-title=""
              data-subtitle="">
        <img src="images/productions/example/02.jpg" alt="" />
      </figure>
      <figure class="grid-cell" onclick="openLightbox(this)"
              data-title=""
              data-subtitle="">
        <img src="images/productions/example/03.jpg" alt="" />
      </figure>
      <figure class="grid-cell" onclick="openLightbox(this)"
              data-title=""
              data-subtitle="">
        <img src="images/productions/example/04.jpg" alt="" />
      </figure>
    </div>

  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-prev" onclick="event.stopPropagation(); shiftImage(-1)">&#8592;</button>
    <button class="lightbox-next" onclick="event.stopPropagation(); shiftImage(1)">&#8594;</button>
    <figure class="lightbox-figure" onclick="event.stopPropagation()">
      <img class="lightbox-img" id="lightbox-img" src="" alt="" />
      <figcaption class="lightbox-caption" id="lightbox-caption">
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-subtitle" id="lightbox-subtitle"></span>
      </figcaption>
    </figure>
  </div>

  <script>
    const cells = Array.from(document.querySelectorAll('.grid-cell'));
    let current = 0;

    // Shows the image plus its data-title / data-subtitle (if any)
    function showImage(i) {
      const cell = cells[i];
      const img = cell.querySelector('img');
      const title = cell.dataset.title || '';
      const subtitle = cell.dataset.subtitle || '';
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox-img').alt = title;
      document.getElementById('lightbox-title').textContent = title;
      document.getElementById('lightbox-subtitle').textContent = subtitle;
      document.getElementById('lightbox-caption').hidden = !(title || subtitle);
    }

    function openLightbox(el) {
      current = cells.indexOf(el);
      showImage(current);
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function shiftImage(dir) {
      current = (current + dir + cells.length) % cells.length;
      showImage(current);
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') shiftImage(1);
      if (e.key === 'ArrowLeft') shiftImage(-1);
    });
  </script>

</body>
</html>
