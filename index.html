<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design — Anna Horzen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="wordmark">Anna Horzen</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link nav-link--active">Design</a>
      <a href="photography.html" class="nav-link">Photography</a>
      <a href="about.html" class="nav-link">About</a>
    </nav>
  </header>

  <main class="grid-main">
    <div class="masonry-grid">

      <!--
        HOW TO ADD ITEMS
        data-title    = main line (shown on the image and in the lightbox)
        data-subtitle = smaller line underneath
        Leave both as "" to show no text on that item.

        IMAGE:
        <figure class="grid-cell" data-title="Title" data-subtitle="Production · Venue, Year">
          <img src="images/your-image.jpg" alt="Title" />
        </figure>

        VIDEO FILE (stored in your repo). Plays silently on hover; opens with sound in the lightbox.
        The poster is the still image shown before it plays. Always include one.
        <figure class="grid-cell" data-title="Title" data-subtitle="Production · Venue, Year">
          <video src="videos/your-video.mp4" poster="images/your-video-poster.jpg"
                 muted loop playsinline preload="metadata"></video>
        </figure>

        VIMEO / YOUTUBE (hosted elsewhere). The image is the thumbnail shown in the grid.
        Vimeo:   data-embed="https://player.vimeo.com/video/123456789"
        YouTube: data-embed="https://www.youtube.com/embed/VIDEO_ID"
        <figure class="grid-cell" data-embed="https://player.vimeo.com/video/123456789"
                data-title="Title" data-subtitle="Production · Venue, Year">
          <img src="images/your-thumbnail.jpg" alt="Title" />
        </figure>
      -->

      <figure class="grid-cell"
              data-title="Title 01"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-01.jpg" alt="Title 01" />
      </figure>
      <figure class="grid-cell"
              data-title="Title 02"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-02.jpg" alt="Title 02" />
      </figure>
      <figure class="grid-cell"
              data-title="Title 03"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-03.jpg" alt="Title 03" />
      </figure>
      <figure class="grid-cell"
              data-title="Title 04"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-04.jpg" alt="Title 04" />
      </figure>
      <figure class="grid-cell"
              data-title="Title 05"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-05.jpg" alt="Title 05" />
      </figure>
      <figure class="grid-cell"
              data-title="Title 06"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-06.jpg" alt="Title 06" />
      </figure>
      <figure class="grid-cell"
              data-title="Title 07"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-07.jpg" alt="Title 07" />
      </figure>
      <figure class="grid-cell"
              data-title="Title 08"
              data-subtitle="Production · Venue, Year">
        <img src="images/proj-08.jpg" alt="Title 08" />
      </figure>

    </div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-prev" onclick="event.stopPropagation(); shiftImage(-1)">&#8592;</button>
    <button class="lightbox-next" onclick="event.stopPropagation(); shiftImage(1)">&#8594;</button>
    <figure class="lightbox-figure" onclick="event.stopPropagation()">
      <div class="lightbox-media" id="lightbox-media"></div>
      <figcaption class="lightbox-caption" id="lightbox-caption">
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-subtitle" id="lightbox-subtitle"></span>
      </figcaption>
    </figure>
  </div>

  <script>
    const cells = Array.from(document.querySelectorAll('.grid-cell'));
    const media = document.getElementById('lightbox-media');
    let current = 0;

    // Set up each grid item: text overlay, video badge, hover preview, click
    cells.forEach((cell) => {
      const title = cell.dataset.title || '';
      const subtitle = cell.dataset.subtitle || '';
      const video = cell.querySelector('video');

      if (title || subtitle) {
        const info = document.createElement('div');
        info.className = 'cell-info';
        if (title) {
          const t = document.createElement('span');
          t.className = 'cell-title';
          t.textContent = title;
          info.appendChild(t);
        }
        if (subtitle) {
          const s = document.createElement('span');
          s.className = 'cell-subtitle';
          s.textContent = subtitle;
          info.appendChild(s);
        }
        cell.appendChild(info);
      }

      if (video || cell.dataset.embed) {
        const badge = document.createElement('span');
        badge.className = 'play-badge';
        badge.textContent = '▶';
        cell.appendChild(badge);
      }

      if (video) {
        video.muted = true;
        cell.addEventListener('mouseenter', () => video.play().catch(() => {}));
        cell.addEventListener('mouseleave', () => video.pause());
      }

      cell.addEventListener('click', () => openLightbox(cell));
    });

    function clearMedia() {
      const v = media.querySelector('video');
      if (v) v.pause();
      media.innerHTML = '';
    }

    function showItem(i) {
      const cell = cells[i];
      const title = cell.dataset.title || '';
      const subtitle = cell.dataset.subtitle || '';
      const video = cell.querySelector('video');
      clearMedia();

      if (cell.dataset.embed) {
        const frame = document.createElement('iframe');
        const url = cell.dataset.embed;
        frame.src = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
        frame.className = 'lightbox-embed';
        frame.allow = 'autoplay; fullscreen; picture-in-picture';
        frame.allowFullscreen = true;
        frame.title = title;
        media.appendChild(frame);
      } else if (video) {
        const v = document.createElement('video');
        v.src = video.currentSrc || video.src;
        if (video.poster) v.poster = video.poster;
        v.className = 'lightbox-img';
        v.controls = true;
        v.autoplay = true;
        v.playsInline = true;
        media.appendChild(v);
      } else {
        const img = document.createElement('img');
        img.src = cell.querySelector('img').src;
        img.alt = title;
        img.className = 'lightbox-img';
        media.appendChild(img);
      }

      document.getElementById('lightbox-title').textContent = title;
      document.getElementById('lightbox-subtitle').textContent = subtitle;
      document.getElementById('lightbox-caption').hidden = !(title || subtitle);
    }

    function openLightbox(cell) {
      current = cells.indexOf(cell);
      const preview = cell.querySelector('video');
      if (preview) preview.pause();
      showItem(current);
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      clearMedia();
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function shiftImage(dir) {
      current = (current + dir + cells.length) % cells.length;
      showItem(current);
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') shiftImage(1);
      if (e.key === 'ArrowLeft') shiftImage(-1);
    });
  </script>

</body>
</html>
