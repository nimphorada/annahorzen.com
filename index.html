<head>

<body>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  #rive-canvas {
    display: block;
    width: 100vw;
    height: calc(100vh - 50px);
    margin-top: 50px;
  }
</style>

<canvas id="rive-canvas"></canvas>

<script src="https://unpkg.com/@rive-app/webgl2"></script>
<script>
  const r = new rive.Rive({
    src: "TestFiles/TEST.riv?v=10",
    canvas: document.getElementById("rive-canvas"),
    autoplay: true,
    stateMachine: "State Machine 1",   // your exact name
    autoBind: true,
    automaticallyHandleEvents: true,
    layout: new rive.Layout({
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center
    }),
    onLoad: () => {
      r.resizeDrawingSurfaceToCanvas();
    }
  });

  window.addEventListener("resize", () => r.resizeDrawingSurfaceToCanvas());
</script>

  <header class="site-header">
    <a href="index.html" class="wordmark">Anna Horzen</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link nav-link--active">Design</a>
      <a href="photography.html" class="nav-link">Photography</a>
      <a href="about.html" class="nav-link">About</a>
    </nav>
  </header>



  <script>
    const cells = Array.from(document.querySelectorAll('.grid-cell'));
    let current = 0;

    function openLightbox(el) {
      current = cells.indexOf(el);
      const src = el.querySelector('img').src;
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function shiftImage(dir) {
      current = (current + dir + cells.length) % cells.length;
      document.getElementById('lightbox-img').src = cells[current].querySelector('img').src;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') shiftImage(1);
      if (e.key === 'ArrowLeft') shiftImage(-1);
    });
  </script>
<script src="/assets/js/external-links.js"></script>
</body>
</html>
