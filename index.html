<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design — Anna Horzen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }

    /* ---------- DESKTOP / TABLET: Rive animation ---------- */
    #rive-canvas {
      display: block;
      width: 100vw;
      height: calc(100vh - 50px);
      margin-top: 50px;
    }

    /* ---------- PHONE: tappable image list ---------- */
    .mobile-home { display: none; }

    @media (max-width: 600px) {
      html, body { height: auto; }
      #rive-canvas { display: none; }

      .mobile-home {
        display: flex;
        flex-direction: column;
        gap: clamp(1.75rem, 8vw, 2.5rem);
        padding: calc(var(--nav-h) + 1.25rem) 1.25rem 3rem;
      }

      .mobile-card {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }

      .mobile-card-img {
        display: block;
        overflow: hidden;
        background: #0a0a0a;
      }
      .mobile-card-img img {
        width: 100%;
        height: auto;          /* keeps each image's natural proportions */
        opacity: 0.92;
        transition: opacity 0.3s ease;
      }

      .mobile-card-title {
        font-family: var(--font-serif);
        font-size: 1.5rem;
        font-weight: 300;
        font-style: italic;
        line-height: 1.2;
        color: var(--text);
      }

      .mobile-card:active .mobile-card-img img,
      .mobile-card:focus-visible .mobile-card-img img { opacity: 1; }
      .mobile-card:active .mobile-card-title,
      .mobile-card:focus-visible .mobile-card-title { color: var(--accent); }
      .mobile-card:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="wordmark">Anna Horzen</a>
    <nav class="site-nav">
      <a href="index.html" class="nav-link nav-link--active">Design</a>
      <a href="photography.html" class="nav-link">Photography</a>
      <a href="about.html" class="nav-link">About</a>
    </nav>
  </header>

  <!-- DESKTOP / TABLET -->
  <canvas id="rive-canvas"></canvas>

  <!-- PHONE
       One <a class="mobile-card"> per image in the Rive file.
       To add one: copy a block, then change the page link, image and title.
       The title sits below the image. To put it above, move the
       <span class="mobile-card-title"> line above the <span class="mobile-card-img"> block. -->
  <main class="mobile-home">

    <a class="mobile-card" href="FoodFight.html">
      <span class="mobile-card-img">
        <img src="images/FoodFight-04.png" alt="Food Fight" loading="lazy" />
      </span>
      <span class="mobile-card-title">Food Fight</span>
    </a>

    <a class="mobile-card" href="ImConnecticut.html">
      <span class="mobile-card-img">
        <img src="images/ImConnecticut-01.jpg" alt="I’m Connecticut" loading="lazy" />
      </span>
      <span class="mobile-card-title">I&rsquo;m Connecticut</span>
    </a>

    <a class="mobile-card" href="ISGPWTD.html">
      <span class="mobile-card-img">
        <img src="images/ISGPWTD-06.jpg" alt="I Saw Goody Proctor with the Devil" loading="lazy" />
      </span>
      <span class="mobile-card-title">I Saw Goody Proctor with the Devil</span>
    </a>

    <a class="mobile-card" href="HereBeSirens.html">
      <span class="mobile-card-img">
        <img src="images/HereBeSirens-03.jpeg" alt="Here Be Sirens" loading="lazy" />
      </span>
      <span class="mobile-card-title">Here Be Sirens</span>
    </a>

  </main>

  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <script>
    // Only load the Rive animation on wider screens, so phones skip it entirely.
    const wideScreen = window.matchMedia('(min-width: 601px)');
    let r = null;

    function startRive() {
      if (r || !wideScreen.matches) return;
      r = new rive.Rive({
        src: "TestFiles/TEST.riv?v=10",
        canvas: document.getElementById("rive-canvas"),
        autoplay: true,
        stateMachine: "State Machine 1",
        autoBind: true,
        automaticallyHandleEvents: true,
        layout: new rive.Layout({
          fit: rive.Fit.Contain,
          alignment: rive.Alignment.Center
        }),
        onLoad: () => r.resizeDrawingSurfaceToCanvas()
      });
    }

    startRive();

    window.addEventListener("resize", () => {
      startRive();                       // starts it if a narrow window was widened
      if (r) r.resizeDrawingSurfaceToCanvas();
    });

    // Shut Rive down when leaving the page, and restart it fresh if the
    // browser restores the page from its back/forward cache (Back button).
    window.addEventListener("pagehide", () => {
      if (r) { r.cleanup(); r = null; }
    });

    window.addEventListener("pageshow", (e) => {
      if (e.persisted) startRive();
    });
  </script>
  <script src="/assets/js/external-links.js"></script>
</body>
</html>
